[project]
name = "peer"
version = "0.0.1"
description = "Build AI PR review agents with evaluation built in"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nicolás Kriman", email = "kriman@gmail.com"},
]
keywords = ["ai", "pr-review", "code-review", "llm-agent", "evaluation", "harness-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "deepeval>=1.0",
    "PyGithub>=2.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "pydantic>=2.0",
    "unidiff>=0.7",
    "tiktoken>=0.7",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "ast-grep-py>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "behave>=1.2.6",
    "pre-commit>=3.7",
]

[project.scripts]
peer = "peer.cli:main"

[project.urls]
Repository = "https://github.com/nkriman/peer"
Issues = "https://github.com/nkriman/peer/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Quality tooling — enforced by .claude/hooks and .pre-commit-config.yaml
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", ".venv", "build", "dist", "openspec/changes/archive"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg — common in FastAPI-style configs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"features/steps/**" = ["F811", "F401"]  # behave step duplicates intentional

[tool.mypy]
python_version = "3.10"
files = ["src/peer"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false   # tighten gradually
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "features.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: long-running tests (skip on Stop hook, run in CI)",
    "integration: hits external services (mock or skip locally)",
]

[tool.coverage.run]
source = ["src/peer"]
branch = true
omit = ["src/peer/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
