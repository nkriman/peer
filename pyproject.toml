[project]
name = "peer"
version = "0.0.1"
description = "Build AI PR review agents with evaluation built in"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nicolás Kriman", email = "kriman@gmail.com"},
]
keywords = ["ai", "pr-review", "code-review", "llm-agent", "evaluation", "harness-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "deepeval>=1.0",
    "PyGithub>=2.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "pydantic>=2.0",
    "unidiff>=0.7",
    "tiktoken>=0.7",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "ast-grep-py>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
peer = "peer.cli:main"

[project.urls]
Repository = "https://github.com/nkriman/peer"
Issues = "https://github.com/nkriman/peer/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
