                    - generic [ref=e207]: "Descubre el detergente líquido Ariel Doble Poder Concentrado para Ropa Blanca y de Color, ideal para quienes buscan un removedor de manchas eficaz y un cuidado excepcional para su ropa. Su fórmula concentrada combina un sistema de bloque enzimático y surfactantes que eliminan las manchas difíciles, como grasa y percudido, al primer lavado. Además, su uso es eficiente: con menos de una tapita, obtienes resultados sorprendentes. Dale a tu ropa el tratamiento que se merece con el detergente Ariel, que también protege los colores y deja un aroma fresco. REMUEVE MANCHAS: Eficaz contra manchas difíciles como grasa y suciedad, cuidando tu ropa en cada lavado. LIMPIEZA SUPERIOR: Su fórmula con bloque enzimático y surfactantes asegura una limpieza profunda y rápida. CONCENTRADO: Menos de una tapita es suficiente para obtener resultados excepcionales, haciendo que tu producto rinda más. IDEAL PARA TODOS: Perfecto para lavar ropa blanca y de color, manteniendo la intensidad de los colores. AROMA FRESCO: Deja en tu ropa un aroma increíble que perdura tras cada lavado. COMPATIBLE: Apto para lavadoras HE, de carga superior y frontal, para mayor comodidad. PAQUETE ECONÓMICO: Contenido de 3 litros, ideal para mantenerte abastecido y listo para el lavado. Instrucciones de uso: 1. Mida. Para lavadoras de 4 a 8 kg llene aproximadamente hasta la línea 1 de la tapa, para lavadoras de 9 kg o más llene aproximadamente hasta línea 3 de la tapa. Para remover manchas más fácilmente dosifique 1 tapa. 2. Aplique sobre las manchas. Vierta un poco de producto directamente sobre las manchas y deje actuar por 5 min. 3. Lave. Agregue la cantidad restante en la lavadora y lave. Importante, lea atentamente las instrucciones de lavado recomendadas en las etiquetas de las prendas."
